# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "27b557ec369085c3a909fc49ce2d774b"
name = "mozemosignage-app"
application_url = "https://mozemosignage-configurator-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "product-updates-stub"
  topic = "Product"
  actions = [ "update" ]
  uri = "https://drove-temp-act-received.trycloudflare.com/webhooks/events/product-updates"
  api_version = "unstable"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_app_proxy,write_files,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://mozemosignage-configurator-app.onrender.com/api/auth" ]

[app_proxy]
url = "https://mozemosignage-configurator-app.onrender.com/proxy/neon-pricing"
subpath = "neon-pricing"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

